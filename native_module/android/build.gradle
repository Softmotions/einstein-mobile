apply plugin: 'com.android.library'

android {
    namespace "com.softmotions.einstein.modules"
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    lint {
        abortOnError false
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation("com.google.android.gms:play-services-games:17.0.0") {
        // play-services-games 17 still depends on the old support library through
        // play-services-base 16. The application is AndroidX based, so exclude it.
        exclude group: 'com.android.support'
    }
    // Force the AndroidX based Play services base library.
    implementation "com.google.android.gms:play-services-base:18.11.1"
    implementation "com.facebook.react:react-android"
}
